version: conference-scope-v1
status: planning_only_not_an_executable_corpus_config
decision: D014
collection_authorized: false
target_year: 2023
selection_policy: Curated flagship AI and related subfield venues; not a universal
  ranking or all computer science conferences.
legacy_pilot_config: configs/corpus.yaml
legacy_pilot_config_policy: Preserve unchanged for historical reproducibility; not
  the expanded release scope.
edition_policy: Never substitute a neighboring year; record a no-edition ledger entry.
inclusion_policy: Complete official main archival research-paper rosters; archival
  full and short papers where applicable. Verify each edition and track before collection.
exclude:
- workshop
- tutorial
- demo
- doctoral_consortium
- student_research_workshop
- invited_talk
- editorial
- withdrawn
- rejected
- supplementary_only
- findings
- nonresearch_industry_track
- datasets_and_benchmarks
