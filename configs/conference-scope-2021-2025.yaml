status: planning_only_not_an_executable_corpus_config
decision: D018
implementation_authorized: false
collection_authorized: false
years:
- 2021
- 2022
- 2023
- 2024
- 2025
conference_series: 34
venue_year_candidates: 170
verified_edition_count: null
historical_registry: configs/conference-scope.yaml
historical_executable_config: configs/corpus-extended-v2.yaml
historical_config_policy: Preserve all historical configs, manifests, assignments, graphs and measured
  reports unchanged. No new pipeline run authorized.
edition_policy: Review each venue-year independently. Conference edition year defines scope; publisher/API
  dates do not substitute for it. Record verified, no-edition, excluded, unavailable and unresolved states.
  Never infer five editions per series.
selection_policy: Curated flagship AI and related subfield venues; not a universal ranking or all computer
  science conferences.
inclusion_policy: Complete official main archival research-paper rosters; archival full and short papers
  where applicable. Verify each edition and track before collection.
exclude:
- workshop
- tutorial
- demo
- doctoral_consortium
- student_research_workshop
- invited_talk
- editorial
- withdrawn
- rejected
- supplementary_only
- findings
- nonresearch_industry_track
- datasets_and_benchmarks
split_policy: Preserve all 5046 legacy and all frozen expanded assignments. Identify cross-year/cross-venue
  versions before new enrichment; old test versions remain held out; exposed papers cannot become fresh
  tests. No new split created.
release_gates_policy: Unchanged global unique five-year targets, not multiplied by year. Deduplicate works
  and people across years; compute yearly support separately.
