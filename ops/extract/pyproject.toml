[project]
name = "sn-extract-runtime"
version = "0.1.0"
description = "Isolated runtime for the final-exam extraction encoders (GLiNER2.5, GLiNER-Relex)."
requires-python = ">=3.12,<3.13"
dependencies = [
    "gliner2[local]==2.2.0",
    "gliner==0.2.30",
    "torch>=2.8",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
