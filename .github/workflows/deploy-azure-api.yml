name: Deploy Azure API

on:
  push:
    branches: [main]
    paths:
      - 'apps/research-explorer/backend/**'
      - 'ops/azure/Dockerfile.api'
      - 'ops/azure/requirements-api.txt'
      - 'ops/azure/scripts/build-image.sh'
      - 'ops/azure/scripts/runtime-contract.py'
      - 'ops/azure/scripts/ci-image-smoke.sh'
      - 'ops/azure/scripts/image-identity.py'
      - 'pyproject.toml'
      - 'uv.lock'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-azure-api
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'HSandz/scientific-network' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      artifact-id: ${{ steps.package.outputs.artifact-id }}
      image-id: ${{ steps.identity.outputs.image-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.9.10'
          enable-cache: false
      - name: Install locked dependencies (no NLP/models)
        run: |
          uv python install 3.12
          uv sync --locked --group dev --extra analysis --extra report
      - name: Repository and production backend checks
        run: |
          uv run pytest
          PYTHONPATH=apps/research-explorer:src uv run pytest apps/research-explorer/backend/tests/test_unit.py apps/research-explorer/backend/tests/test_production.py
          uv run research-network validate --input tests/fixtures/synthetic_graph.json
          bash -n ops/azure/scripts/*.sh
          uv export --locked --no-dev --no-emit-project --prune beautifulsoup4 --prune httpx --prune pyarrow --no-annotate --no-header --output-file /tmp/requirements-api.txt
          diff -u ops/azure/requirements-api.txt /tmp/requirements-api.txt
      - name: Build and start production amd64 image
        env:
          IMAGE: scientific-network-api:sha-${{ github.sha }}
        run: |
          ops/azure/scripts/build-image.sh "sha-$GITHUB_SHA"
          ops/azure/scripts/ci-image-smoke.sh "$IMAGE"
      - name: Package private image and record immutable identity
        id: identity
        env:
          IMAGE: scientific-network-api:sha-${{ github.sha }}
        run: |
          docker save "$IMAGE" | gzip -1 > image.tar.gz
          python3 ops/azure/scripts/image-identity.py image.tar.gz --sha "$GITHUB_SHA" > image-id.txt
          echo "image-id=$(cat image-id.txt)" >> "$GITHUB_OUTPUT"
          sha256sum image.tar.gz > image.tar.gz.sha256
          {
            echo "Commit: $GITHUB_SHA"
            echo "Image: $IMAGE"
            echo "Image content digest: $(cat image-id.txt)"
            cat image.tar.gz.sha256
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: package
        with:
          name: azure-api-image
          path: image.tar.gz
          if-no-files-found: error
          archive: true
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: azure-api-identity
          path: |
            image-id.txt
            image.tar.gz.sha256
          retention-days: 1

  deploy:
    environment: production-api
    needs: build
    if: github.repository == 'HSandz/scientific-network' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - name: Require configured passwordless Azure identity
        env:
          CLIENT: ${{ vars.AZURE_API_CLIENT_ID }}
          TENANT: ${{ vars.AZURE_API_TENANT_ID }}
          SUBSCRIPTION: ${{ vars.AZURE_API_SUBSCRIPTION_ID }}
          VM: ${{ vars.AZURE_API_VM_ID }}
        run: test -n "$CLIENT" && test -n "$TENANT" && test -n "$SUBSCRIPTION" && test -n "$VM"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: azure-api-identity
      - uses: Azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_API_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_API_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_API_SUBSCRIPTION_ID }}
      - name: Deliver verified package and activate API only
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.build.outputs.artifact-id }}
          AZURE_VM_ID: ${{ vars.AZURE_API_VM_ID }}
        run: python3 ops/azure/scripts/deliver-ci-image.py
