<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Research Trend Navigator, redesign mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;500;700&family=Atkinson+Hyperlegible:wght@400;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<style>
/* ---------- Tokens ---------- */
:root {
  --paper: #F4F6F8;          /* chart paper */
  --surface: #FFFFFF;        /* raised, clickable surfaces */
  --sunken: #E9EDF1;         /* rail, wells */
  --ink: #1C2733;            /* graphite */
  --muted: #526070;          /* secondary text, 5.9:1 on paper */
  --faint: #7A8794;          /* tertiary, non-essential */
  --rule: #D5DCE3;
  --cool: #2F6DB5;
  --heat: #E3870E;
  --neutral: #A4ADB7;        /* stable midpoint */
  --cool-ink: #2A62A3;       /* momentum colour safe for text */
  --heat-ink: #96550A;
  --method: #5B4FCF; --task: #178F7E; --dataset: #A23E8C; --org: #55606E;
  --focus: #1C2733;
  --serif: "Source Serif 4", Georgia, serif;
  --sans: "Atkinson Hyperlegible Next", "Atkinson Hyperlegible", system-ui, sans-serif;
  /* modular scale 1.25 on 16px */
  --s-1: 0.8rem; --s0: 1rem; --s1: 1.25rem; --s2: 1.5625rem; --s3: 1.953rem; --s4: 2.441rem;
  --r-sm: 6px; --r-md: 10px;
  color-scheme: light;
}
[data-theme="dark"] {
  /* an observatory at night: deep slate blue, not black */
  --paper: #16202B;
  --surface: #1F2B38;
  --sunken: #111A23;
  --ink: #E5EAF0;
  --muted: #A9B5C2;
  --faint: #7D8A98;
  --rule: #2F3E4E;
  --cool: #5E9BE6;
  --heat: #F0A23B;
  --neutral: #6E7B89;
  --cool-ink: #8AB8F0;
  --heat-ink: #F3B35C;
  --method: #A39BF2; --task: #4FC4B1; --dataset: #DB86C8; --org: #A6B0BC;
  --focus: #E5EAF0;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { font-size: 16px; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font-family: var(--sans); font-size: var(--s0); line-height: 1.5;
  font-variant-numeric: tabular-nums lining-nums;
  -webkit-font-smoothing: antialiased;
}
button, input, textarea, select { font: inherit; color: inherit; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
h1, h2, h3 { margin: 0; font-weight: 600; }
p { margin: 0; }

/* ---------- Shell ---------- */
.app { display: grid; grid-template-columns: 232px 1fr; min-height: 100vh; background: linear-gradient(90deg, var(--sunken) 232px, transparent 232px); }
.rail {
  position: sticky; top: 0; height: 100vh; background: var(--sunken);
  display: flex; flex-direction: column; padding: 20px 12px 16px; gap: 2px;
}
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 10px 22px; text-decoration: none; }
.brand-mark { width: 22px; height: 22px; flex: none; border-radius: 5px;
  background: linear-gradient(90deg, var(--cool) 0 33%, var(--neutral) 33% 66%, var(--heat) 66%); }
.brand-name { font-weight: 700; line-height: 1.2; font-size: 0.95rem; }
.nav-item {
  display: flex; align-items: center; gap: 12px; padding: 9px 10px; border-radius: var(--r-sm);
  text-decoration: none; color: var(--muted); font-weight: 500;
}
.nav-item svg { width: 20px; height: 20px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.nav-item:hover { color: var(--ink); background: color-mix(in srgb, var(--ink) 6%, transparent); }
.nav-item[aria-current="page"] { color: var(--ink); background: var(--surface); font-weight: 700; box-shadow: 0 0 0 1px var(--rule); }
.rail-spacer { flex: 1; }
.history { margin: 4px 0 10px 32px; display: none; flex-direction: column; gap: 1px; }
.history.open { display: flex; }
.history-title { font-size: var(--s-1); color: var(--faint); padding: 6px 10px 4px; }
.history a { font-size: 0.875rem; color: var(--muted); text-decoration: none; padding: 5px 10px; border-radius: var(--r-sm);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.history a:hover { color: var(--ink); background: color-mix(in srgb, var(--ink) 6%, transparent); }
.history a[aria-current="true"] { color: var(--ink); font-weight: 700; }

.main { min-width: 0; display: flex; flex-direction: column; }
.topbar { display: flex; align-items: center; gap: 12px; padding: 14px 40px; position: sticky; top: 0; z-index: 20; background: var(--paper); }
.search { position: relative; flex: 1; max-width: 560px; }
.search input {
  width: 100%; height: 42px; padding: 0 64px 0 40px; border-radius: var(--r-md);
  border: 1px solid var(--rule); background: var(--surface);
}
.search input::placeholder { color: var(--muted); }
.search .glass { position: absolute; left: 13px; top: 12px; width: 18px; height: 18px; stroke: var(--muted); fill: none; stroke-width: 1.8; }
.kbd { position: absolute; right: 10px; top: 9px; font-size: var(--s-1); color: var(--muted); border: 1px solid var(--rule); border-radius: 5px; padding: 1px 7px; background: var(--paper); }
.search-results { position: absolute; left: 0; right: 0; top: 48px; background: var(--surface); border: 1px solid var(--rule); border-radius: var(--r-md);
  box-shadow: 0 12px 32px -12px rgb(20 30 40 / .25); padding: 6px; display: none; }
.search-results.open { display: block; }
.search-results button { display: flex; width: 100%; gap: 10px; align-items: center; padding: 8px 10px; border: 0; background: none; border-radius: var(--r-sm); text-align: left; cursor: pointer; }
.search-results button:hover, .search-results button.active { background: var(--paper); }
.search-results .kind { margin-left: auto; color: var(--muted); font-size: 0.875rem; }
.icon-btn { width: 40px; height: 40px; border-radius: var(--r-md); border: 1px solid var(--rule); background: var(--surface); display: grid; place-items: center; cursor: pointer; }
.icon-btn svg { width: 19px; height: 19px; stroke: var(--ink); fill: none; stroke-width: 1.7; stroke-linecap: round; }
.topbar .spacer { flex: 1; }

.view { padding: 12px 40px 64px; max-width: 1280px; width: 100%; }
.tabbar, .more-sheet { display: none; }

/* ---------- Shared bits ---------- */
.page-head h1 { font-family: var(--serif); font-size: var(--s4); line-height: 1.12; letter-spacing: -0.01em; max-width: 32ch; }
.page-head .sub { color: var(--muted); margin-top: 6px; font-size: var(--s1); }
.lede { font-family: var(--serif); font-size: var(--s1); line-height: 1.5; max-width: 62ch; margin-top: 18px; }
.section { margin-top: 56px; }
.section > h2 { font-size: var(--s2); font-weight: 700; letter-spacing: -0.005em; }
.section > .hint { color: var(--muted); margin-top: 4px; max-width: 70ch; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; flex: none; }
.dot.Method { background: var(--method); } .dot.Task { background: var(--task); } .dot.Dataset { background: var(--dataset); } .dot.Organization { background: var(--org); }
.momentum { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; font-size: 0.875rem; padding: 2px 10px 2px 8px; border-radius: 999px; white-space: nowrap; }
.momentum::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--m); }
.textlink { color: var(--ink); font-weight: 700; text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; text-decoration-color: var(--faint); background: none; border: 0; padding: 0; cursor: pointer; }
.textlink:hover { text-decoration-color: var(--ink); }
.quiet-btn { background: none; border: 0; color: var(--muted); cursor: pointer; padding: 4px 6px; border-radius: var(--r-sm); display: inline-flex; gap: 6px; align-items: center; }
.quiet-btn:hover { color: var(--ink); background: color-mix(in srgb, var(--ink) 6%, transparent); }
.info { width: 20px; height: 20px; border-radius: 50%; border: 1px solid var(--faint); color: var(--muted); background: none; font-size: 12px; font-weight: 700; display: inline-grid; place-items: center; cursor: pointer; padding: 0; vertical-align: 2px; font-family: var(--serif); font-style: italic; }
.info:hover { color: var(--ink); border-color: var(--ink); }
.pop { position: absolute; z-index: 40; width: 320px; background: var(--surface); border: 1px solid var(--rule); border-radius: var(--r-md); padding: 14px 16px; box-shadow: 0 16px 40px -16px rgb(20 30 40 / .35); font-size: 0.9375rem; color: var(--ink); }
.pop p + p { margin-top: 8px; }
dialog.drawer { margin: 0 0 0 auto; height: 100vh; max-height: 100vh; width: min(480px, 100vw); border: 0; padding: 32px; background: var(--surface); color: var(--ink); box-shadow: -20px 0 60px -30px rgb(0 0 0 / .4); }
dialog.drawer::backdrop { background: rgb(16 24 32 / .35); }
dialog.drawer h2 { font-family: var(--serif); font-size: var(--s3); margin-bottom: 16px; }
dialog.drawer h3 { font-size: var(--s0); margin-top: 22px; margin-bottom: 4px; }
dialog.drawer p, dialog.drawer li { color: var(--ink); max-width: 60ch; }
dialog.drawer ul { padding-left: 18px; margin: 6px 0; }
dialog.drawer .close { position: absolute; right: 20px; top: 20px; }

/* ---------- Pulse ---------- */
.pulse-grid { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 56px; margin-top: 36px; align-items: start; }
.strip { width: 100%; }
.strip-head, .strip-row { display: grid; grid-template-columns: minmax(262px, 1.7fr) repeat(5, minmax(34px, 0.4fr)) 108px 112px; align-items: center; column-gap: 4px; }
.strip-head { color: var(--muted); font-size: 0.875rem; padding: 0 10px 8px; }
.strip-head span:nth-child(n+2):nth-child(-n+6) { text-align: center; }
.strip-head .r { text-align: right; }
.strip-row { width: 100%; border: 0; background: none; text-align: left; cursor: pointer; padding: 3px 10px; border-radius: var(--r-sm); min-height: 46px; }
.strip-row:hover { background: var(--surface); box-shadow: 0 0 0 1px var(--rule); }
.strip-row:hover .s-name { text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }
.s-name { display: flex; gap: 9px; align-items: center; font-weight: 700; min-width: 0; }
.s-name span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cell { height: 34px; border-radius: 3px; }
.s-label { padding-left: 12px; }
.s-change { text-align: right; white-space: nowrap; }
.s-change b { font-weight: 700; }
.s-change .from { color: var(--muted); }
.strip-divider { height: 1px; background: var(--rule); margin: 6px 10px; }
.strip-legend #how { margin-left: auto; }
.strip-legend { display: flex; align-items: center; gap: 14px; margin: 18px 10px 0; color: var(--muted); font-size: 0.875rem; flex-wrap: wrap; }
.scale { width: 180px; height: 10px; border-radius: 5px; background: linear-gradient(90deg, var(--cool), var(--neutral), var(--heat)); }
.side { display: flex; flex-direction: column; gap: 44px; }
.askbox { background: var(--surface); border-radius: 14px; padding: 22px; box-shadow: 0 0 0 1px var(--rule); }
.askbox h2 { font-size: var(--s1); font-weight: 700; }
.askbox form { display: flex; margin-top: 14px; position: relative; }
.askbox input { flex: 1; height: 46px; padding: 0 52px 0 14px; border: 1px solid var(--rule); border-radius: var(--r-md); background: var(--paper); }
.askbox input::placeholder { color: var(--muted); }
.send { position: absolute; right: 5px; top: 5px; width: 36px; height: 36px; border: 0; border-radius: 8px; background: var(--ink); cursor: pointer; display: grid; place-items: center; }
.send svg { width: 18px; height: 18px; stroke: var(--paper); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.starters { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }
.starter { text-align: left; background: var(--paper); border: 1px solid transparent; border-radius: var(--r-md); padding: 10px 12px; cursor: pointer; line-height: 1.4; }
.starter:hover { border-color: var(--rule); background: var(--surface); }
.smallworld .yes { font-family: var(--serif); font-size: var(--s4); line-height: 1; font-weight: 600; margin: 10px 0 10px; }
.smallworld h2 { font-size: var(--s1); font-weight: 700; }
.smallworld p { color: var(--ink); }
.smallworld .textlink { display: inline-block; margin-top: 12px; }
.leaders { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 16px; margin-top: 20px; }
.leader { background: var(--surface); border-radius: 12px; padding: 16px; box-shadow: 0 0 0 1px var(--rule); text-align: left; border: 0; cursor: pointer; display: flex; flex-direction: column; gap: 12px; }
.leader:hover { box-shadow: 0 0 0 1px var(--ink); }
.leader h3 { font-size: var(--s0); font-weight: 700; display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.leader .momentum { align-self: flex-start; }
.leader ol { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.leader li { font-size: 0.875rem; line-height: 1.3; }
.bar { height: 6px; border-radius: 3px; background: var(--ink); opacity: .78; margin-top: 5px; }
.bar-track { background: color-mix(in srgb, var(--ink) 8%, transparent); border-radius: 3px; }
.leader .val { color: var(--muted); }

/* ---------- Ask ---------- */
.ask { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr); gap: 0; height: calc(100vh - 70px); margin: -12px -40px -64px; border-top: 1px solid var(--rule); }
.convo { display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--rule); }
.convo-scroll { flex: 1; overflow-y: auto; padding: 28px 36px 24px; }
.welcome h1 { font-family: var(--serif); font-size: var(--s3); line-height: 1.2; }
.welcome > p { color: var(--muted); margin-top: 8px; max-width: 56ch; }
.intent-groups { display: grid; grid-template-columns: 1fr 1fr; gap: 22px 18px; margin-top: 28px; }
.intent h2 { font-size: var(--s0); font-weight: 700; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
.intent h2 svg { width: 18px; height: 18px; stroke: var(--muted); fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.intent .qcard { display: block; width: 100%; text-align: left; background: var(--surface); border: 0; border-radius: var(--r-md); padding: 12px 14px; box-shadow: 0 0 0 1px var(--rule); cursor: pointer; line-height: 1.4; }
.intent .qcard + .qcard { margin-top: 8px; }
.intent .qcard:hover { box-shadow: 0 0 0 1px var(--ink); }
.intent .qcard small { display: block; color: var(--muted); margin-top: 4px; font-size: 0.8125rem; }
.msg-user { margin-left: auto; max-width: 85%; background: var(--surface); box-shadow: 0 0 0 1px var(--rule); padding: 12px 16px; border-radius: 14px 14px 4px 14px; width: fit-content; }
.turn + .turn { margin-top: 36px; }
.plan { margin-top: 22px; }
.plan-title { font-weight: 700; display: flex; align-items: center; gap: 8px; }
.plan-title { background: none; border: 0; padding: 2px 4px 2px 0; cursor: pointer; }
.plan-title .elapsed { color: var(--muted); font-weight: 400; font-size: 0.875rem; }
.plan-title .chev { width: 16px; height: 16px; stroke: var(--muted); fill: none; stroke-width: 2; transition: transform .15s; }
.plan.collapsed ol { display: none; }
.plan.collapsed .chev { transform: rotate(-90deg); }
.plan ol { list-style: none; margin: 10px 0 0; padding: 0; position: relative; }
.plan li { display: grid; grid-template-columns: 22px 1fr; gap: 10px; padding: 5px 0; }
.plan li .st { width: 18px; height: 18px; margin-top: 3px; }
.plan li .t { font-weight: 500; }
.plan li .res { color: var(--muted); font-size: 0.9375rem; }
.plan li.pending { opacity: .0; }
.spin { border: 2px solid var(--rule); border-top-color: var(--ink); border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.check { stroke: var(--ink); fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.answer { font-family: var(--serif); font-size: 1.125rem; line-height: 1.62; margin-top: 22px; max-width: 68ch; }
.answer p + p, .answer p + ul, .answer ul + p { margin-top: 12px; }
.answer ul { margin: 10px 0 0; padding-left: 20px; }
.answer li { padding-left: 2px; }
.answer li + li { margin-top: 3px; }
.fn { font-family: var(--sans); font-size: 0.7rem; font-weight: 700; vertical-align: super; line-height: 0; margin-left: 1px; padding: 0 2px; color: var(--ink); background: none; border: 0; cursor: pointer; text-decoration: underline; text-decoration-color: var(--faint); text-underline-offset: 2px; }
.fn:hover { background: color-mix(in srgb, var(--ink) 10%, transparent); border-radius: 3px; }
.caret { display: inline-block; width: 8px; height: 1.1em; background: var(--ink); vertical-align: -2px; margin-left: 2px; opacity: .6; }
.checkline { display: flex; gap: 8px; align-items: flex-start; color: var(--muted); font-size: 0.9375rem; margin-top: 18px; max-width: 64ch; }
.checkline svg { width: 18px; height: 18px; flex: none; margin-top: 2px; stroke: var(--muted); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
.chip-btn { border: 1px solid var(--rule); background: var(--surface); border-radius: 999px; padding: 6px 14px; cursor: pointer; font-size: 0.9375rem; }
.chip-btn:hover { border-color: var(--ink); }
.composer { padding: 14px 36px 18px; border-top: 1px solid var(--rule); background: var(--paper); }
.composer form { display: flex; gap: 8px; align-items: center; position: relative; }
.composer textarea { flex: 1; resize: none; height: 48px; padding: 12px 56px 12px 14px; border-radius: 12px; border: 1px solid var(--rule); background: var(--surface); line-height: 1.4; }
.composer textarea::placeholder { color: var(--muted); }
.composer .send { right: 54px; top: 6px; }
.adv-menu { position: absolute; right: 0; bottom: 56px; width: 280px; }
.adv-menu fieldset { border: 0; padding: 0; margin: 0; }
.adv-menu legend { font-weight: 700; margin-bottom: 6px; }
.seg { display: inline-flex; background: var(--paper); border-radius: 8px; padding: 3px; gap: 2px; }
.seg label { padding: 4px 12px; border-radius: 6px; cursor: pointer; }
.seg input { position: absolute; opacity: 0; }
.seg input:checked + span { font-weight: 700; }
.seg label:has(input:checked) { background: var(--surface); box-shadow: 0 0 0 1px var(--rule); }
.seg label:has(input:focus-visible) { outline: 2px solid var(--focus); }
.toggle-row { display: flex; justify-content: space-between; align-items: center; margin-top: 14px; }
.small-note { color: var(--muted); font-size: 0.8125rem; margin-top: 6px; }

.evidence { display: flex; flex-direction: column; min-height: 0; background: var(--surface); }
.ev-head { display: flex; align-items: center; gap: 16px; padding: 14px 24px 0; border-bottom: 1px solid var(--rule); }
.ev-head h2 { font-size: var(--s0); font-weight: 700; margin-right: auto; padding-bottom: 12px; }
.tabs { display: flex; gap: 4px; }
.tab { border: 0; background: none; padding: 8px 12px 12px; cursor: pointer; color: var(--muted); font-weight: 500; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tab[aria-selected="true"] { color: var(--ink); font-weight: 700; border-bottom-color: var(--ink); }
.tab .n { color: var(--muted); font-weight: 400; margin-left: 4px; }
.ev-body { flex: 1; overflow-y: auto; padding: 20px 24px 24px; min-height: 0; }
.ev-caption { color: var(--ink); max-width: 62ch; }
.ev-caption .muted { color: var(--muted); }
.ev-empty { color: var(--muted); max-width: 44ch; margin: 18vh auto 0; text-align: center; }
.ev-empty svg { width: 120px; height: 80px; display: block; margin: 0 auto 14px; }
.graph-wrap { position: relative; margin-top: 10px; }
.graph-wrap svg { width: 100%; height: auto; display: block; }
.g-legend { display: flex; flex-wrap: wrap; gap: 6px 18px; color: var(--muted); font-size: 0.875rem; margin-top: 8px; }
.g-legend span { display: inline-flex; align-items: center; gap: 6px; }
.ring { width: 12px; height: 12px; border-radius: 50%; border: 2.5px solid var(--heat); display: inline-block; }
.hopbar { display: flex; gap: 6px; align-items: center; color: var(--muted); font-size: 0.875rem; margin-top: 12px; }
.hopbar i { width: 22px; height: 4px; border-radius: 2px; background: var(--rule); display: inline-block; }
.hopbar i.on { background: var(--ink); }
.tooltip { position: absolute; pointer-events: none; background: var(--ink); color: var(--paper); padding: 6px 10px; border-radius: 6px; font-size: 0.8125rem; white-space: nowrap; opacity: 0; transition: opacity .12s; }
.node-label { font-family: var(--sans); font-size: 13px; fill: var(--ink); paint-order: stroke; stroke: var(--surface); stroke-width: 4px; stroke-linejoin: round; }
.node-label.strong { font-weight: 700; font-size: 14px; }
table.data { width: 100%; border-collapse: collapse; font-size: 0.9375rem; margin-top: 12px; }
table.data td:first-child { min-width: 180px; }
table.data th { text-align: left; font-weight: 700; color: var(--muted); padding: 8px 10px; border-bottom: 1px solid var(--rule); white-space: nowrap; position: sticky; top: -20px; background: var(--surface); }
table.data td { padding: 8px 10px; border-bottom: 1px solid color-mix(in srgb, var(--rule) 60%, transparent); }
table.data .num { text-align: right; white-space: nowrap; }
table.data tr.hl td { background: color-mix(in srgb, var(--heat) 10%, transparent); }
.seg-steps { display: flex; gap: 6px; flex-wrap: wrap; }
.seg-steps button { border: 1px solid var(--rule); background: var(--surface); border-radius: 999px; padding: 4px 12px; cursor: pointer; font-size: 0.875rem; }
.seg-steps button[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.cites { list-style: none; padding: 0; margin: 12px 0 0; }
.cites > li { display: grid; grid-template-columns: 28px 1fr; gap: 8px; padding: 12px 8px; border-radius: 8px; }
.cites > li.flash { background: color-mix(in srgb, var(--heat) 14%, transparent); }
.cites .num { font-weight: 700; }
.cites .lab { font-weight: 700; }
.paper { margin-top: 6px; }
.paper a { font-family: var(--serif); font-size: 1.0625rem; text-decoration: none; line-height: 1.35; }
.paper a:hover { text-decoration: underline; text-underline-offset: 3px; }
.paper .meta { color: var(--muted); font-size: 0.875rem; }
.papers-h { font-size: var(--s0); font-weight: 700; margin-top: 28px; }
.papers-h:first-child { margin-top: 0; }
.plain-papers { list-style: none; padding: 0; margin: 8px 0 0; }
.plain-papers li { padding: 8px 0; border-bottom: 1px solid color-mix(in srgb, var(--rule) 60%, transparent); }
.mobile-ev-toggle { display: none; }

/* ---------- Topic ---------- */
.back { display: inline-flex; gap: 6px; align-items: center; color: var(--muted); text-decoration: none; font-size: 0.9375rem; margin-bottom: 18px; }
.back:hover { color: var(--ink); }
.topic-kind { display: flex; gap: 10px; align-items: center; color: var(--muted); margin-bottom: 10px; }
.topic-hero h1 { font-family: var(--serif); font-size: var(--s4); line-height: 1.15; max-width: 34ch; text-wrap: balance; letter-spacing: -0.01em; }
.topic-hero .sub { color: var(--muted); margin-top: 12px; font-size: var(--s1); max-width: 60ch; }
.share-chart { margin-top: 28px; position: relative; }
.share-chart svg { width: 100%; height: auto; display: block; overflow: visible; }
.chart-foot { display: flex; gap: 16px; align-items: center; color: var(--muted); font-size: 0.875rem; margin-top: 6px; }
.two { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 56px; }
.groups { list-style: none; padding: 0; margin: 16px 0 0; }
.groups li { display: grid; grid-template-columns: minmax(0, 1fr) 140px 70px; gap: 14px; align-items: center; padding: 9px 0; border-bottom: 1px solid color-mix(in srgb, var(--rule) 60%, transparent); }
.groups .nm { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.groups .papers { color: var(--muted); font-size: 0.875rem; }
.groups .v { text-align: right; font-weight: 700; }
.note { color: var(--muted); font-size: 0.9375rem; margin-top: 12px; max-width: 60ch; }
.chipset h3 { font-size: var(--s0); font-weight: 700; margin-top: 20px; display: flex; gap: 8px; align-items: center; }
.chipset h3:first-of-type { margin-top: 14px; }
.chiprow { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.echip { display: inline-flex; gap: 8px; align-items: center; border-radius: 999px; padding: 4px 12px 4px 10px; background: var(--surface); box-shadow: 0 0 0 1px var(--rule); font-size: 0.9375rem; border: 0; cursor: pointer; }
.echip:hover { box-shadow: 0 0 0 1px var(--ink); }
.echip .c { color: var(--muted); }
.summary { font-family: var(--serif); font-size: var(--s1); line-height: 1.6; max-width: 64ch; margin-top: 14px; }
.summary-src { color: var(--muted); font-size: 0.875rem; margin-top: 10px; }
.toplist { list-style: none; padding: 0; margin: 14px 0 0; counter-reset: p; }
.toplist li { padding: 14px 0; border-bottom: 1px solid color-mix(in srgb, var(--rule) 60%, transparent); display: grid; grid-template-columns: 30px 1fr; gap: 8px; }
.toplist li::before { counter-increment: p; content: counter(p); color: var(--muted); font-weight: 700; }

/* ---------- Placeholder & About ---------- */
.placeholder { max-width: 640px; margin-top: 10vh; }
.placeholder h1 { font-family: var(--serif); font-size: var(--s4); }
.placeholder p { font-size: var(--s1); margin-top: 14px; color: var(--ink); }
.placeholder .soon { color: var(--muted); margin-top: 22px; font-size: var(--s0); display: flex; align-items: center; gap: 10px; }
.about dl { display: grid; grid-template-columns: 220px 1fr; gap: 12px 24px; margin-top: 28px; max-width: 760px; }
.about dt { color: var(--muted); }
.about dd { margin: 0; font-weight: 500; }
.about code { font-family: var(--sans); font-weight: 700; background: var(--sunken); padding: 2px 8px; border-radius: 5px; }
.about ul { max-width: 70ch; padding-left: 20px; }
.about li + li { margin-top: 6px; }

/* ---------- Responsive ---------- */
@media (max-width: 1180px) {
  .pulse-grid { grid-template-columns: 1fr; }
  .side { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; }
  .leaders { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .two { grid-template-columns: 1fr; gap: 0; }
}
@media (max-width: 1000px) {
  .ask { grid-template-columns: 1fr; height: auto; }
  .convo { border-right: 0; }
  .convo-scroll { overflow: visible; }
  .evidence { border-top: 1px solid var(--rule); min-height: 560px; }
  .composer { position: sticky; bottom: 0; }
}
@media (max-width: 768px) {
  .app { grid-template-columns: 1fr; background: none; }
  .rail { display: none; }
  .topbar { padding: 10px 16px; }
  .kbd { display: none; }
  .topbar .spacer { display: none; }
  .search { max-width: none; }
  .search input { padding-right: 12px; }
  .view { padding: 8px 16px 96px; }
  .page-head h1, .topic-hero h1 { font-size: var(--s3); }
  .page-head .sub, .topic-hero .sub { font-size: var(--s0); }
  .lede { font-size: 1.0625rem; }
  .side { grid-template-columns: 1fr; }
  .strip-head, .strip-row { grid-template-columns: minmax(0, 1fr) repeat(5, 22px) 92px; column-gap: 3px; }
  .strip-head .lab, .s-label { display: none; }
  .strip-row { padding: 6px 4px; min-height: 52px; }
  .strip-head { padding: 0 4px 6px; font-size: 0.75rem; }
  .s-name { align-items: flex-start; font-size: 0.9375rem; }
  .s-name .dot { margin-top: 7px; }
  .strip-head .yr { font-size: 0; }
  .strip-head .yr::after { content: attr(data-short); font-size: 0.75rem; }
  .s-name span:last-child { white-space: normal; line-height: 1.25; }
  .cell { height: 28px; }
  .s-change { font-size: 0.875rem; }
  .leaders { grid-template-columns: 1fr; }
  .intent-groups { grid-template-columns: 1fr; }
  .ask { margin: -8px -16px -96px; }
  .convo-scroll { padding: 20px 16px; }
  .composer { padding: 10px 16px; bottom: 64px; }
  .ev-head { padding: 12px 16px 0; flex-wrap: wrap; gap: 0; }
  .ev-head h2 { width: 100%; padding-bottom: 4px; }
  .tab { padding: 8px 10px 10px; }
  .ev-body { padding: 16px; }
  .evidence { padding-bottom: 72px; }
  .groups li { grid-template-columns: minmax(0, 1fr) 80px 56px; }
  .about dl { grid-template-columns: 1fr; gap: 2px; }
  .about dd { margin-bottom: 12px; }
  .tabbar { display: grid; grid-template-columns: repeat(6, 1fr); position: fixed; left: 0; right: 0; bottom: 0; height: 64px; background: var(--surface); border-top: 1px solid var(--rule); z-index: 30; }
  .tabbar a, .tabbar button { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 0.75rem; color: var(--muted); text-decoration: none; background: none; border: 0; }
  .tabbar svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .tabbar [aria-current="page"] { color: var(--ink); font-weight: 700; }
  .more-sheet { position: fixed; left: 8px; right: 8px; bottom: 72px; z-index: 31; background: var(--surface); border-radius: 14px; box-shadow: 0 0 0 1px var(--rule), 0 20px 40px -20px rgb(0 0 0 / .4); padding: 8px; display: none; }
  .more-sheet.open { display: block; }
  .more-sheet a { display: flex; gap: 12px; align-items: center; padding: 12px; text-decoration: none; border-radius: 8px; }
  .more-sheet svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.6; }
  .msg-user { max-width: 92%; }
  .answer { font-size: 1.0625rem; }
  .mobile-ev-toggle { display: inline-flex; margin-top: 14px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}

/* ---------- Pulse ---------- */
function stripRow(s) {
  const max = Math.max(...s.share);
  const hue = d3.color(rowHue(s.t)), paper = d3.color(css("--paper"));
  const cells = s.share.map((v, i) => {
    const k = max ? 0.1 + 0.9 * (v / max) : 0;
    const c = d3.interpolateLab(paper, hue)(k);
    return `<span class="cell" style="background:${c}" title="${D.years[i]}: ${fmtPct(v, 2)} of papers (${s.papers[i]})"></span>`;
  }).join("");
  const first = s.share[0], last = s.share[4];
  return `<button class="strip-row" data-id="${s.id}" aria-label="${esc(s.name)}, ${s.label}, ${fmtPct(first)} of papers in 2021 to ${fmtPct(last)} in 2025">
    <span class="s-name"><span class="dot ${s.kind}" aria-hidden="true"></span><span>${esc(s.name)}</span></span>
    ${cells}
    <span class="s-label">${momentumChip(s.class, s.label, s.t)}</span>
    <span class="s-change"><span class="from">${fmtPct(first)}</span> → <b>${fmtPct(last)}</b></span>
  </button>`;
}

    <aside class="side">
      <section class="askbox" aria-labelledby="ab-h">
        <h2 id="ab-h">Ask the graph</h2>
        <form id="pulse-ask"><label class="sr-only" for="pa">Your question</label>

        <div class="starters">

/* ---------- Topic ---------- */
function heroSentence(s) {
  const a = fmtPct(s.share[0]), b = fmtPct(s.share[4]);

  if (s.id === "method:Q3621696") return `Large language models are the fastest-rising method: ${a} → ${b} of papers`;
  if (s.class === "emerging") return `${s.name} went from almost nothing to ${b} of papers`;
  if (s.class === "rising") return `${s.name} is a rising ${kind}: ${a} → ${b} of papers`;
  if (s.class === "declining") return `${s.name} is cooling: ${a} → ${b} of papers`;
  return `${s.name} is holding steady: ${a} → ${b} of papers`;
}

function flash(el) { el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash"); setTimeout(() => el.classList.remove("flash"), 1600); }
function drawShare(fig, s) {
  const W = 1000, H = 320, m = { t: 30, r: 90, b: 34, l: 48 };
  const x = d3.scalePoint().domain(D.years).range([m.l, W - m.r]);
  const ymax = Math.max(...s.share) * 1.15;
  const y = d3.scaleLinear().domain([0, ymax]).nice(4).range([H - m.b, m.t]);
  const col = thermal(s.t);
  const data = s.share.map((v, i) => [D.years[i], v]);
  const line = d3.line().x(d => x(d[0])).y(d => y(d[1])).curve(d3.curveMonotoneX);
  const area = d3.area().x(d => x(d[0])).y0(y(0)).y1(d => y(d[1])).curve(d3.curveMonotoneX);
  const sv = d3.select(fig).append("svg").attr("viewBox", `0 0 ${W} ${H}`).attr("role", "img")
    .attr("aria-label", `${s.name}: ${data.map(d => d[0] + " " + fmtPct(d[1], 2)).join(", ")}`);
  const ticks = y.ticks(4);
  sv.append("g").selectAll("line").data(ticks).join("line").attr("x1", m.l).attr("x2", W - m.r).attr("y1", y).attr("y2", y)
    .attr("stroke", css("--rule")).attr("stroke-dasharray", d => d === 0 ? null : "2 4");
  sv.append("g").selectAll("text").data(ticks).join("text").attr("x", m.l - 10).attr("y", d => y(d) + 4).attr("text-anchor", "end")
    .attr("fill", css("--muted")).attr("font-size", 13).text(d => d + "%");
  sv.append("g").selectAll("text").data(D.years).join("text").attr("x", x).attr("y", H - 8).attr("text-anchor", "middle")
    .attr("fill", css("--muted")).attr("font-size", 14).text(d => d);
  const g = d3.color(col); g.opacity = 0.14;
  sv.append("path").attr("d", area(data)).attr("fill", g);
  sv.append("path").attr("d", line(data)).attr("fill", "none").attr("stroke", col).attr("stroke-width", 3.5);
  sv.append("g").selectAll("circle").data(data).join("circle").attr("cx", d => x(d[0])).attr("cy", d => y(d[1])).attr("r", 5)
    .attr("fill", css("--paper")).attr("stroke", col).attr("stroke-width", 2.5);
  sv.append("g").selectAll("text").data(data).join("text").attr("x", d => x(d[0])).attr("y", d => y(d[1]) - 14)
    .attr("text-anchor", "middle").attr("font-size", 14).attr("font-weight", (d, i) => i === 4 ? 700 : 400)
    .attr("fill", (d, i) => i === 4 ? css("--ink") : css("--muted")).text(d => fmtPct(d[1]));
}

    <g fill="${css("--surface")}" stroke="${css("--faint")}" stroke-width="1.5"><circle cx="20" cy="40" r="6"/><circle cx="60" cy="20" r="8"/><circle cx="100" cy="34" r="5"/><circle cx="64" cy="62" r="5"/></g></svg>`;
}
function setTabs(d) {
  document.querySelectorAll(".tab").forEach(t => {
    const n = $(".n", t);
    if (!d) { n.textContent = ""; t.disabled = true; t.setAttribute("aria-selected", "false"); return; }
    t.disabled = false;
    const c = { Graph: d.nodes.length || "", Chart: "", Table: d.tables.reduce((a, x) => a + x.rows.length, 0), Papers: d.result_count || "" }[t.dataset.tab];
    n.textContent = c;
  });
}
function setTab(name) {
  if (!current) return;
  current.tab = name;
  document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", t.dataset.tab === name));
  const body = $("#ev-body"); body.innerHTML = ""; body.scrollTop = 0;
  ({ Graph: renderGraph, Chart: renderChart, Table: renderTable, Papers: renderPapers })[name](body, current.demo);
}
function play(d) {
  current = { demo: d, tab: d.nodes.length ? "Graph" : "Chart", hop: -1, done: false };
  setTabs(d);
  const c = $("#convo");
  const tStart = performance.now();
  c.innerHTML = `<div class="turn"><div class="msg-user">${esc(d.question)}</div>
    <div class="plan" id="planbox"><button class="plan-title" id="plantoggle" aria-expanded="true" aria-controls="plan"><span>Plan</span><span class="elapsed" id="elapsed"></span><svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
      <ol id="plan">${d.plan.map((p, i) => `<li class="pending" data-i="${i}"><span class="st"></span><div><div class="t">${esc(p.text)}</div><div class="res"></div></div></li>`).join("")}</ol></div>
    <div class="answer" id="answer"></div><div id="after"></div></div>`;
  setTab(current.tab);
  $("#plantoggle").onclick = e => { const c = $("#planbox").classList.toggle("collapsed"); e.currentTarget.setAttribute("aria-expanded", !c); };
  const STEP = 850;
  d.plan.forEach((p, i) => {
    later(() => {
      const li = $(`#plan li[data-i="${i}"]`); li.classList.remove("pending");
      $(".st", li).outerHTML = `<span class="st spin" role="img" aria-label="Working"></span>`;
    }, i * STEP);
    later(() => {
      const li = $(`#plan li[data-i="${i}"]`);
      $(".st", li).outerHTML = `<svg class="st check" viewBox="0 0 24 24" role="img" aria-label="Done"><path d="M5 12.5 10 17 19 7"/></svg>`;
      $(".res", li).textContent = p.result;
      $("#elapsed").textContent = `${((i + 1) * STEP / 1000).toFixed(1)} s`;
      current.hop = i; // hop i revealed after step i
      if (current.tab === "Graph") revealTo(i);
    }, i * STEP + STEP * 0.8);

}
function streamAnswer(d) {
  const a = $("#answer");
  // Flatten to tokens, keeping block structure.
  const blocks = d.blocks;
  let html = "", tokens = [];
  blocks.forEach((b, bi) => b.segs.forEach(seg => {
    if (typeof seg === "string") seg.split(/(\s+)/).forEach(w => w && tokens.push({ bi, w }));
    else tokens.push({ bi, fn: seg.fn });
  }));
  let n = 0;
  const render = upto => {
    const parts = blocks.map(() => []);
    tokens.slice(0, upto).forEach(t => parts[t.bi].push(t.fn ? `<button class="fn" data-fn="${t.fn}" aria-label="Source ${t.fn}">${t.fn}</button>` : esc(t.w)));
    let out = "", inList = false;
    blocks.forEach((b, i) => {
      if (!parts[i].length) return;
      if (b.type === "li" && !inList) { out += "<ul>"; inList = true; }
      if (b.type !== "li" && inList) { out += "</ul>"; inList = false; }
      out += b.type === "li" ? `<li>${parts[i].join("")}</li>` : `<p>${parts[i].join("")}</p>`;
    });
    if (inList) out += "</ul>";
    a.innerHTML = out + (upto < tokens.length ? '<span class="caret" aria-hidden="true"></span>' : "");
  };
  const tick = () => {
    n += 3;
    render(Math.min(n, tokens.length));
    if (n < tokens.length && !reduced) later(tick, 28);
    else { render(tokens.length); finish(d); }
  };
  if (reduced) { render(tokens.length); finish(d); } else tick();
}
function finish(d) {
  current.done = true;
  const pb = $("#planbox"); pb.classList.add("collapsed"); $("#plantoggle").setAttribute("aria-expanded", "false");
  $("#elapsed").textContent = `${d.plan.length} steps, all done`;
  $("#after").innerHTML = `<div class="checkline"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 4 6v6c0 4.5 3.4 8 8 9 4.6-1 8-4.5 8-9V6z"/><path d="m8.5 12 2.5 2.5 4.5-5"/></svg>
    <span>Every number is checked against the retrieved data. Written by a 4-billion-parameter language model from the graph, ${d.latency.toFixed(1)} s.</span></div>
    <div class="chips" aria-label="Follow-up questions">${d.follow.map(f => `<button class="chip-btn">${esc(f)}</button>`).join("")}</div>
    <button class="chip-btn mobile-ev-toggle" id="jump-ev">See the evidence</button>`;
  $("#answer").querySelectorAll(".fn").forEach(b => b.onclick = () => { setTab("Papers"); const li = $("#fn-" + b.dataset.fn); if (li) { li.scrollIntoView({ block: "center", behavior: reduced ? "auto" : "smooth" }); flash(li); } });
  $("#jump-ev").onclick = () => $(".evidence").scrollIntoView({ behavior: reduced ? "auto" : "smooth" });
  $("#cmp").placeholder = "Ask a follow-up…";
}

/* Graph: the one orchestrated moment */
let G = null;
const SHORT = n => n.replace("Beijing National Research Center for Information Science and Technology", "Beijing National Research Center (BNRist)")
  .replace("The Hong Kong University of Science and Technology (Guangzhou)", "HKUST (Guangzhou)")
  .replace("Beijing University of Posts and Telecommunications", "Beijing Univ. of Posts and Telecom.")
  .replace("University of Science and Technology of China", "Univ. of Science and Technology of China")
  .replace("Shanghai Artificial Intelligence Laboratory", "Shanghai AI Laboratory");
function layout(d) {
  const nodes = d.nodes.map(n => ({ ...n, short: SHORT(n.name) })), byId = new Map(nodes.map(n => [n.id, n]));
  const links = d.edges.filter(e => byId.has(e.source) && byId.has(e.target)).map(e => ({ ...e, source: byId.get(e.source), target: byId.get(e.target) }));
  const center = nodes.find(n => n.hop === 0);
  if (d.id.startsWith("demo-01")) {
    // Funnel: Tsinghua and its wider circle on the left, the growers in a ranked column, the subject on the right.
    const W = 600, H = 560;
    center.x = 34; center.y = H / 2;
    const grow = nodes.filter(n => n.highlight).sort((a, b) => b.delta - a.delta);
    grow.forEach((n, i) => { n.x = 432; n.y = 28 + i * (H - 56) / (grow.length - 1); });
    const llm = nodes.find(n => n.hop === 2); llm.x = 572; llm.y = H / 2;
    const rest = nodes.filter(n => n.hop === 1 && !n.highlight);
    rest.forEach((n, i) => { n.x = 74 + (i % 3) * 16 + ((i * 37) % 9); n.y = 30 + i * (H - 60) / Math.max(1, rest.length - 1); });
    return { W, H, nodes, links, mode: "funnel" };
  }
  // Bow tie: the subject in the middle, first-hop neighbours in a column on the left, second-hop on the right.
  const W = 600;
  links.forEach(l => [l.source, l.target].forEach(n => { n.weight = Math.max(n.weight || 0, l.weight || 0); }));
  const cols = [1, 2].map(h => nodes.filter(n => n.hop === h).sort((a, b) => (b.weight || 0) - (a.weight || 0)));
  const H = Math.max(360, Math.max(...cols.map(c => c.length)) * 27 + 40);
  center.x = W / 2; center.y = H / 2;
  cols.forEach((col, k) => col.forEach((n, i) => {
    n.x = k ? 392 : 208; n.y = H / 2 + (i - (col.length - 1) / 2) * 27;
  }));
  return { W, H, nodes, links, mode: "bowtie" };
}
function nodeHue(n) { return css("--" + ({ Method: "method", Task: "task", Dataset: "dataset", Organization: "org" }[n.label] || "org")); }
function renderGraph(body, d) {
  if (!d.nodes.length) {
    body.innerHTML = `<div class="ev-empty">${emptyGraphSvg()}<p>This answer came from one ranked table, so there is no path through the graph to draw. The chart and table show the result.</p></div>`;
    return;
  }
  const isT = d.id.startsWith("demo-01");
  const grew = d.nodes.filter(n => n.highlight).length;
  body.innerHTML = `<p class="ev-caption">${isT
      ? `Tsinghua University and its strongest collaborators. The <b>${grew}</b> that grew their share of language-model papers after 2022 are ringed and linked to the subject.`
      : `Diffusion models and the tasks and datasets that appear in the same papers. Thicker lines mean more shared papers.`}</p>
    <div class="hopbar" id="hopbar"></div>
    <div class="graph-wrap" id="gw"><div class="tooltip" id="tt"></div></div>
    <div class="g-legend">${[...new Set(d.nodes.map(n => n.label))].map(l => `<span><span class="dot ${l}"></span>${l === "Organization" ? "Organization" : l}</span>`).join("")}
      ${isT ? '<span><span class="ring"></span>Share grew after 2022</span>' : ""}</div>`;
  G = G && G.id === d.id ? G : { id: d.id, ...layout(d) };
  const { W, H, nodes, links } = G;
  const sv = d3.select("#gw").append("svg").attr("viewBox", `0 0 ${W} ${H}`).attr("role", "img")
    .attr("aria-label", `Graph of ${nodes.length} entities and ${links.length} links`);
  const maxW = d3.max(links, l => l.weight) || 1;
  const heat = css("--heat");
  sv.append("g").attr("class", "links").selectAll("line").data(links).join("line")
    .attr("x1", l => l.source.x).attr("y1", l => l.source.y).attr("x2", l => l.target.x).attr("y2", l => l.target.y)
    .attr("stroke", l => l.hop === 2 && G.mode === "funnel" ? heat : css("--faint"))
    .attr("stroke-opacity", l => l.hop === 2 && G.mode === "funnel" ? 0.75 : (isT ? (l.source.highlight ? 0.35 : 0.2) : 0.45))
    .attr("stroke-width", l => 1 + 3 * Math.sqrt(l.weight / maxW))
    .attr("data-hop", l => l.hop)
    .each(function () { const len = Math.hypot(this.x2.baseVal.value - this.x1.baseVal.value, this.y2.baseVal.value - this.y1.baseVal.value); this.style.strokeDasharray = len; this.style.strokeDashoffset = len; });
  const r = n => n.hop === 0 ? 14 : (G.mode === "funnel" && n.hop === 2 ? 14 : (n.highlight ? 5 + Math.sqrt(n.delta * 100) * 1.6 : (G.mode === "funnel" ? 3.5 : 6)));
  const ng = sv.append("g").selectAll("g").data(nodes).join("g").attr("transform", n => `translate(${n.x},${n.y})`).attr("data-hop", n => n.hop)
    .style("opacity", 0);
  ng.append("circle").attr("r", r).attr("fill", n => nodeHue(n)).attr("stroke", n => n.highlight ? heat : css("--surface"))
    .attr("stroke-width", n => n.highlight ? 3 : 1.5);
  const funnel = G.mode === "funnel";
  const labelled = n => !funnel || n.hop === 0 || n.highlight || n.hop === 2;
  nodes.filter(labelled).forEach(n => {
    let anchor, dx;
    if (funnel) { anchor = n.hop === 0 ? "middle" : (n.hop === 2 ? "middle" : "end"); dx = n.hop === 1 ? -(r(n) + 8) : 0; }
    else { anchor = n.hop === 0 ? "middle" : (n.x < W / 2 ? "end" : "start"); dx = n.hop === 0 ? 0 : (n.x < W / 2 ? -(r(n) + 7) : r(n) + 7); }
    let dy = n.hop === 0 || (funnel && n.hop === 2) ? r(n) + 19 : 4.5;
    if (funnel && n.hop === 0) { anchor = "start"; dx = -r(n); dy = -r(n) - 10; }
    if (funnel && n.hop === 2) { anchor = "end"; dx = r(n); dy = -r(n) - 26; n._two = true; }
    n._l = { x: dx, y: dy, anchor };
  });
  ng.filter(labelled).append("text").attr("class", n => "node-label" + (n.hop === 0 || n.hop === 2 && n.label === "Method" ? " strong" : ""))
    .attr("x", n => n._l.x).attr("y", n => n._l.y).attr("text-anchor", n => n._l.anchor)
    .text(n => n._two ? "" : funnel && n.highlight ? `${n.short}  +${(n.delta * 100).toFixed(1)}` : (n.short.length > 30 ? n.short.slice(0, 28) + "…" : n.short));
  ng.selectAll("text").filter(n => n._two).each(function (n) { const t = d3.select(this); t.append("tspan").attr("x", n._l.x).text("Large language"); t.append("tspan").attr("x", n._l.x).attr("dy", 16).text("models"); });
  const tt = $("#tt");
  ng.on("mouseenter", (e, n) => {
    tt.textContent = n.name + (n.delta != null ? `: share up ${(n.delta * 100).toFixed(1)} points` : "");
    const box = $("#gw").getBoundingClientRect(), k = box.width / W;
    tt.style.left = (n.x * k + 12) + "px"; tt.style.top = (n.y * k - 30) + "px"; tt.style.opacity = 1;
  }).on("mouseleave", () => tt.style.opacity = 0);
  const maxHop = d3.max(nodes, n => n.hop);
  $("#hopbar").innerHTML = d3.range(maxHop + 1).map(h => `<i data-h="${h}"></i>`).join("") + `<span id="hoptext"></span>`;
  G.maxHop = maxHop;
  G.shown = -1;
  revealTo(current.done ? 99 : current.hop, current.done);
}
function revealTo(step, instant) {
  if (!G || !$("#gw svg")) return;
  // plan step 0 (read question) reveals hop 0; step k reveals hop k.
  const hop = Math.min(step, G.maxHop);
  if (hop <= G.shown) return;
  const sv = d3.select("#gw svg");
  const dur = instant || reduced ? 0 : 650;
  for (let h = G.shown + 1; h <= hop; h++) {
    sv.selectAll(`g[data-hop="${h}"]`).transition().delay((d, i) => dur ? i * 18 + (h > 0 ? 220 : 0) : 0).duration(dur).style("opacity", 1);
    sv.selectAll(`line[data-hop="${h}"]`).transition().delay((d, i) => dur ? i * 12 : 0).duration(dur).style("stroke-dashoffset", 0);
  }
  G.shown = hop;
  document.querySelectorAll("#hopbar i").forEach(i => i.classList.toggle("on", +i.dataset.h <= hop));
  const txt = ["Starting point", "First hop", "Second hop"];
  if ($("#hoptext")) $("#hoptext").textContent = hop >= G.maxHop ? "Complete walk" : txt[hop];
}

/* Chart */
function renderChart(body, d) {
  const sv = (w, h, label) => d3.select(body).append("svg").attr("viewBox", `0 0 ${w} ${h}`).attr("role", "img").attr("aria-label", label).style("width", "100%").style("height", "auto").style("overflow", "visible");
  const muted = css("--muted"), ink = css("--ink"), rule = css("--rule");
  if (d.chart === "slope") {
    const tb = d.tables.find(t => t.columns.includes("Change"));
    const rows = tb.rows.map((r, i) => [r[0], r[1], r[2], tb.pre[i], r[3], r[4]]);
    const allZero = rows.every(r => r[3] === 0);
    body.insertAdjacentHTML("beforeend", `<p class="ev-caption">Share of each organization's papers that are about large language models, up to 2022 and after. ${allZero ? `None of the ${rows.length} had such a paper up to 2022; after 2022 they reach ${(d3.min(rows, r => r[4]) * 100).toFixed(1)}% to ${(d3.max(rows, r => r[4]) * 100).toFixed(1)}%.` : ""}</p>`);
    const W = 640, H = 500, x0 = 90, x1 = 300, top = 40, bot = 470;
    const y = d3.scaleLinear().domain([0, d3.max(rows, r => r[4]) * 1.05]).range([bot, top]);

    s.append("line").attr("x1", x0).attr("x2", x0).attr("y1", top - 10).attr("y2", bot).attr("stroke", rule);
    s.append("line").attr("x1", x1).attr("x2", x1).attr("y1", top - 10).attr("y2", bot).attr("stroke", rule);
    s.append("text").attr("x", x0).attr("y", top - 20).attr("text-anchor", "middle").attr("fill", muted).attr("font-size", 14).text("Up to 2022");
    s.append("text").attr("x", x1).attr("y", top - 20).attr("text-anchor", "middle").attr("fill", muted).attr("font-size", 14).text("After 2022");
    s.append("g").selectAll("text").data(y.ticks(5)).join("text").attr("x", x0 - 12).attr("y", v => y(v) + 4).attr("text-anchor", "end").attr("fill", muted).attr("font-size", 13).text(v => (v * 100).toFixed(0) + "%");
    const maxd = d3.max(rows, r => r[5]);

    s.append("g").selectAll("circle").data(rows.flatMap(r => [[x0, r[3], r], [x1, r[4], r]])).join("circle").attr("cx", p => p[0]).attr("cy", p => y(p[1])).attr("r", 3.5).attr("fill", p => col(p[2]));

    const over = lab[lab.length - 1].y - bot; if (over > 0) lab.forEach(l => l.y -= over);
    for (let i = lab.length - 2; i >= 0; i--) if (lab[i + 1].y - lab[i].y < 15) lab[i].y = lab[i + 1].y - 15;
    const short = n => n.replace("Beijing National Research Center for Information Science and Technology", "Beijing National Research Center (BNRist)").replace("The Hong Kong University of Science and Technology (Guangzhou)", "HKUST (Guangzhou)").replace("Beijing University of Posts and Telecommunications", "Beijing Univ. of Posts and Telecom.");
    s.append("g").selectAll("text").data(lab).join("text").attr("x", x1 + 12).attr("y", l => l.y + 4).attr("font-size", 13).attr("fill", ink)
      .text(l => `${(l.r[4] * 100).toFixed(1)}%  ${short(l.r[0])}`);
  } else if (d.chart === "lines") {

    s.append("g").selectAll("text").data(y.ticks(4)).join("text").attr("x", m.l - 8).attr("y", v => y(v) + 4).attr("text-anchor", "end").attr("font-size", 14).attr("fill", muted).text(v => v.toFixed(1) + "%");
    s.append("g").selectAll("text").data(D.years).join("text").attr("x", x).attr("y", H - 8).attr("text-anchor", "middle").attr("font-size", 14).attr("fill", muted).text(v => v);
    const cag = t.rows.map(r => r[4]), mx = d3.max(cag);

    s.append("g").selectAll("text").data(lab).join("text").attr("x", W - m.r + 10).attr("y", l => l.y + 4).attr("font-size", 14).attr("fill", ink).attr("font-weight", l => l.i === 0 ? 700 : 400)
      .text(l => `${l.se.name} ${l.se.share[4].toFixed(2)}%`);
  } else {
    body.insertAdjacentHTML("beforeend", `<p class="ev-caption">${d.id.startsWith("demo-05") ? "Specialisation in causal inference: how many times more of the organization's work is on the topic than average." : "Shared papers with diffusion models, by task and by dataset."}</p>`);
    d.tables.forEach(t => {

      if (d.tables.length > 1) body.insertAdjacentHTML("beforeend", `<h3 class="papers-h" style="display:flex;gap:8px;align-items:center"><span class="dot ${t.kind}"></span>${t.kind === "Task" ? "Tasks" : "Datasets"}</h3>`);
      const s = sv(W, H, t.title);
      const g = s.selectAll("g").data(rows).join("g").attr("transform", (r, i) => `translate(0,${10 + i * rh})`);
      g.append("text").attr("x", lw - 10).attr("y", 15).attr("text-anchor", "end").attr("font-size", 13).attr("fill", ink).text(r => r[0].length > 36 ? r[0].slice(0, 34) + "…" : r[0]);
      g.append("rect").attr("x", lw).attr("y", 4).attr("height", 14).attr("rx", 2).attr("width", r => x(r[vi])).attr("fill", ink).attr("opacity", 0.78);
      g.append("text").attr("x", r => lw + x(r[vi]) + 8).attr("y", 15).attr("font-size", 14).attr("fill", muted).text(r => t.formats ? r[vi].toFixed(1) + "×" : r[vi]);
    });
  }
}

/* Table */
function fmtCell(v, f) {
  if (f === "pct") return (v * 100).toFixed(1) + "%";
  if (f === "pct0") return "+" + (v * 100).toFixed(0) + "% a year";
  if (f === "pp") return "+" + (v * 100).toFixed(1) + " points";
  if (f === "x") return v.toFixed(1) + "×";
  return esc(v);
}
function renderTable(body, d, which) {
  const idx = which ?? d.tables.length - 1;
  const t = d.tables[idx];
  body.innerHTML = `${d.tables.length > 1 ? `<div class="seg-steps" role="group" aria-label="Result step">${d.tables.map((x, i) => `<button aria-pressed="${i === idx}" data-i="${i}">Step ${x.step}: ${esc(x.title)}</button>`).join("")}</div>` : ""}
    <p class="ev-caption" style="margin-top:12px">${esc(t.title)}. ${t.rows.length} rows.</p>
    <table class="data"><thead><tr>${t.columns.map((c, i) => `<th class="${i && typeof t.rows[0][i] === "number" ? "num" : ""}">${esc(c)}</th>`).join("")}</tr></thead>
    <tbody>${t.rows.map(r => `<tr>${r.map((v, i) => `<td class="${typeof v === "number" || /^\d+ of \d+$/.test(v) ? "num" : ""}">${fmtCell(v, (t.formats || [])[i])}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
  body.querySelectorAll(".seg-steps button").forEach(b => b.onclick = () => renderTable(body, d, +b.dataset.i));
}

/* Papers */
function paperHtml(p) {
  if (!p) return "";
  return `<div class="paper"><a href="${p.url}" target="_blank" rel="noopener">${esc(p.title)}</a><div class="meta">${p.venue} ${p.year}, ${esc(p.authors.join(", "))}${p.n_authors > 3 ? " and others" : ""}</div></div>`;
}
function renderPapers(body, d) {
  const cites = d.footnotes.map(f => `<li id="fn-${f.n}"><span class="num">${f.n}</span><div><div class="lab">${esc(f.label)}</div>
    ${f.papers.length ? f.papers.map(id => paperHtml(d.papers[id])).join("") : `<div class="paper"><span class="meta" style="color:var(--muted)">Result table from this step. See the Table tab.</span></div>`}</div></li>`).join("");
  const others = d.result_ids.filter(id => !d.cited.includes(id));
  body.innerHTML = `<h3 class="papers-h">Cited in the answer</h3><ol class="cites">${cites}</ol>
    <h3 class="papers-h">Other papers in this result</h3>
    ${others.length ? `<p class="note" style="margin-top:4px">${others.length} more papers support the result rows without being cited directly.</p>
      <ul class="plain-papers">${others.slice(0, 12).map(id => `<li>${paperHtml(d.papers[id])}</li>`).join("")}</ul>` : `<p class="note" style="margin-top:4px">None. Every paper behind this result is cited above.</p>`}`;
}

/* ---------- Search ---------- */
(function search() {
  const q = $("#q"), box = $("#search-results");
  const items = [...D.strip.map(s => ({ name: s.name, kind: s.kind, go: "#/topic/" + encodeURIComponent(s.id) })),
    ...[...new Map(D.leaders.flatMap(l => l.orgs).map(o => [o.name, o])).values()].map(o => ({ name: o.name, kind: "Organization", go: "#/groups" }))];
  let act = 0, res = [];
  const draw = () => {
    const t = q.value.trim().toLowerCase();
    res = t ? items.filter(i => i.name.toLowerCase().includes(t)).slice(0, 7) : items.slice(0, 6);
    box.innerHTML = res.length ? res.map((r, i) => `<button role="option" class="${i === act ? "active" : ""}" data-go="${r.go}"><span class="dot ${r.kind}"></span>${esc(r.name)}<span class="kind">${r.kind}</span></button>`).join("")
      : `<p style="padding:10px;color:var(--muted)">Nothing matches “${esc(q.value)}”. Try a method such as diffusion models, or ask the question instead.</p>`;
    box.querySelectorAll("button").forEach(b => b.onmousedown = e => { e.preventDefault(); location.hash = b.dataset.go; close(); });
  };
  const open = () => { act = 0; draw(); box.classList.add("open"); q.setAttribute("aria-expanded", "true"); };
  const close = () => { box.classList.remove("open"); q.setAttribute("aria-expanded", "false"); q.blur(); q.value = ""; };
  q.onfocus = open; q.oninput = () => { act = 0; draw(); };
  q.onblur = () => setTimeout(() => { box.classList.remove("open"); q.setAttribute("aria-expanded", "false"); }, 100);
  q.onkeydown = e => {
    if (e.key === "ArrowDown") { act = Math.min(res.length - 1, act + 1); draw(); e.preventDefault(); }
    if (e.key === "ArrowUp") { act = Math.max(0, act - 1); draw(); e.preventDefault(); }
    if (e.key === "Enter" && res[act]) { location.hash = res[act].go; close(); }
  };
  addEventListener("keydown", e => { if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { e.preventDefault(); q.focus(); } });
})();

/* ---------- Theme ---------- */
function applyTheme(t) {
  document.documentElement.dataset.theme = t;
  $("#theme").setAttribute("aria-label", t === "dark" ? "Switch to light theme" : "Switch to dark theme");
  $("#theme-icon").innerHTML = t === "dark" ? '<circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4"/>' : '<path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/>';
  try { localStorage.setItem("rtn-theme", t); } catch (e) {}
}
$("#theme").onclick = () => {
  applyTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark");
  if (current && current.done && location.hash.startsWith("#/ask/")) { setTab(current.tab); return; } // keep the finished answer
  route();
};
const params = new URLSearchParams(location.search);
applyTheme(params.get("theme") || (() => { try { return localStorage.getItem("rtn-theme"); } catch (e) { return null; } })() || "light");
route();
</script>
